name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dhttp.proxyHost= -Dhttps.proxyHost="

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Strip proxy settings
        run: |
          for f in gradle.properties gradle/gradle.properties gradle/gradle-daemon-jvm.properties; do
            if [ -f "$f" ]; then
              sed -i '/proxyHost/d;/proxyPort/d' "$f"
            fi
          done

      - name: Create local.properties
        run: |
          touch local.properties
          echo "DONATION_CARD_NUMBER=" >> local.properties
          echo "DONATION_CARD_HOLDER=" >> local.properties

      - name: Create secrets.properties
        run: |
          echo "DEFAULT_SUB_URL=https://sub.channelmyanmar.site/ms?token=msapkpromaxultra" > secrets.properties

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MSNet-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
